<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title stratégique : Double profil + Hub régional principal -->
    <title>S. Digital Provence 13 | Développeur Full Stack & Data Engineer Aix-Marseille</title>

    <!-- Meta Description avec toutes tes zones cibles (158 caractères, parfait pour le SEO local) -->
    <meta name="description"
        content="Développeur web & Data Engineer : Aix-Marseille, Étang de Berre, Côte Bleue et Pays Salonnais. S Digital Provence 13 crée vos applications et pipelines data.">

    <link rel="canonical" href="https://s-digital-provence-13.fr">

    <!-- Open Graph optimisé pour LinkedIn et tes partages réseaux -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://s-digital-provence-13.fr">
    <meta property="og:title" content="S. Digital Provence 13 | Solutions Web & Architecture Data">
    <meta property="og:description" content="Boostez votre activité (Aix-Marseille, Étang de Berre, Côte Bleue, Pays Salonnais) : applications web performantes et ingénierie de données sur-mesure.">
    <meta property="og:image" content="https://s-digital-provence-13.fr/assets/photo_seb.png"> 

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header class="header" id="main-header"></header>

    <main id="page-contact">
        <h2>Contactez-moi</h2>
        <p>Pour toute question, contactez-moi via le formulaire ci-dessous.</p>

        <form action="https://formspree.io/f/xaqpddjz" id="contact-form" method="post" class="form_contact" aria-labelledby="page-contact">
            
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required minlength="2" maxlength="30" placeholder="Votre nom"
                autocomplete="family-name">

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" required minlength="2" maxlength="30"
                placeholder="Votre prénom" autocomplete="given-name">

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required placeholder="Votre Email" autocomplete="email">

            <label for="message">Message :</label>
            <textarea id="message" name="message" required placeholder="Votre message"></textarea>

            <p id="compteur" aria-live="polite">0 caractères</p>

            <button type="submit" id="btn-envoyer" class="btn_submit" disabled>Envoyer</button>
        </form>
    </main>

    <footer class="footer" id="main_footer"></footer>
    <script src="script.js"></script>
</body>

</html>
